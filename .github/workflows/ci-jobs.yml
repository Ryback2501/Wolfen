name: CI jobs

# Reusable CI. Called by pr-work-to-dev.yml and pr-dev-to-main.yml.
# Generalized from Mockscii. The kick-off skill resolves every {{placeholder}}
# from the chosen stack adapter and DELETES whole jobs that don't apply to the
# project (e.g. a library with no docker image drops the `docker` job; a CLI may
# drop `e2e`). Keep every job that survives wired into branch-protection's
# required checks.
#
# Wolfen: the game must build and pass its tests on Linux, Windows and macOS, so
# `unit` and `build` run on an ubuntu/windows/macos matrix (check names
# `unit (<os>)` / `build (<os>)`). `lint` stays on ubuntu. bgfx and SDL3 build from
# source, so `build/` is cached per OS and job, and the timeouts are 30 minutes.

on:
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-lint-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: build-${{ runner.os }}-lint-
      - run: "make deps"
      - run: "make lint"

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev
      - name: Install C++ toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install C++ toolchain (Windows)
        if: runner.os == 'Windows'
        run: command -v make >/dev/null || choco install make --no-progress -y
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-unit-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: build-${{ runner.os }}-unit-
      - run: "make deps"
      - run: "make test"

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev
      - name: Install C++ toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install C++ toolchain (Windows)
        if: runner.os == 'Windows'
        run: command -v make >/dev/null || choco install make --no-progress -y
      - uses: actions/cache@v6
        with:
          path: build
          key: build-${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: build-${{ runner.os }}-build-
      - run: "make deps"
      - run: "make build"
      - uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ matrix.os }}
          path: dist

  # --- optional: secret + dependency scan. Toggled by the SECURITY_SCAN repo
  #     variable (flip it on without editing this file). When enabled, kick-off
  #     adds `CI / security` to the branch-protection required checks so a finding
  #     blocks merge. Deterministic tooling — no LLM in the loop. ---
  security:
    name: security
    runs-on: ubuntu-latest
    if: vars.SECURITY_SCAN == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Personal accounts need no license; GitHub *orgs* require GITLEAKS_LICENSE.
      - name: Dependency vulnerability audit
        run: |
          echo "no package-manager dependency audit for this stack (deps pinned via CMake FetchContent); gitleaks secret scan still runs"
