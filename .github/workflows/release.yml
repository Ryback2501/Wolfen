name: Release

# Fires on every push to main (i.e. after a dev->main fast-forward). Tags the
# version, builds & uploads release artifacts, creates the GitHub Release, and —
# only when the matching repo variable is enabled — publishes a Docker image and/or
# deploys to a host. Generalized from Mockscii. Build/version surfaces are the only
# stack-specific bits; publish/deploy stay gated so a fresh repo releases cleanly.

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: |
          VERSION=$(sed 's/^v//' VERSION)
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not parse a semver version from VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  create-tag:
    name: Create version tag
    needs: [read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag v$VERSION
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

  create-artifacts:
    # Wolfen: one zip per OS (wolfen-<version>-<linux|windows|macos>.zip).
    name: Build & zip artifacts (${{ matrix.platform }})
    needs: [read-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install C++ toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-format clang-tidy pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev
      - name: Install C++ toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install C++ toolchain (Windows)
        if: runner.os == 'Windows'
        run: command -v make >/dev/null || choco install make --no-progress -y
      - name: Build & zip
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          make deps
          make build
          (cd dist && cmake -E tar cf "../wolfen-${VERSION}-${PLATFORM}.zip" --format=zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: wolfen-*.zip
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [read-version, create-tag, create-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          # Empty body — release notes are written by hand on the release page.
          gh release create "v$VERSION" --title "v$VERSION" --notes "" \
            "wolfen-$VERSION-linux.zip" "wolfen-$VERSION-windows.zip" "wolfen-$VERSION-macos.zip"
